version: 2

# Majors are deliberately excluded from the groups, which means Dependabot
# raises them as individual PRs instead.
#
# Previously every update landed in two giant grouped PRs. One group carried
# eslint 9->10, tailwind 3->4, zod 3->4 and tailwind-merge 2->3 together, so the
# PR could only merge by completing four unrelated migrations at once. None ever
# were: the PRs sat open for months and the safe patch updates inside them --
# including security fixes -- were held hostage to them.
#
# Now minor/patch flows continuously as a group, and each major arrives on its
# own so it can be scheduled as the piece of real work it is.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Capacitor is the one exception to "majors arrive individually", because
      # its packages peer-depend on each other's exact major. Split up, the
      # majors are not merely inconvenient -- they are individually impossible:
      # #61 bumped @capacitor/push-notifications to 8, which needs
      # @capacitor/core >=8, while @capacitor/android stayed at 7.5 pinning
      # core ^7.5. #62 bumped android to 8 with the same conflict in reverse.
      # Neither could ever go green alone, and both sat failing `npm ci`.
      #
      # Grouping majors here does not recreate the hostage problem the note
      # above describes: this is one library versioning in lockstep, not four
      # unrelated migrations sharing a branch.
      capacitor:
        patterns:
          - "@capacitor/*"
        update-types: ["major", "minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
