# CI Test Workflow
# Runs linting and tests on all pushes and pull requests

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
  # verify-summary.mjs writes <stage>.json here; merged by the verify-report job.
  VERIFY_STAGE_DIR: verify-stages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run verify:lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript
        run: npm run verify:typecheck

  coverage:
    name: Test Coverage (>=85%)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit coverage
        run: npm run verify:unit

      - name: Run integration coverage
        run: npm run verify:integration

      - name: Upload VERIFY stage counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-stage-coverage
          path: verify-stages/
          retention-days: 1

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [coverage, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run verify:build

  ui-evidence:
    # Screenshots + Playwright trace of key pages on every run (not a required check).
    name: UI Evidence
    runs-on: ubuntu-latest
    needs: [coverage, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run verify:build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI evidence
        run: npm run verify:ui

      - name: Upload VERIFY stage counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-stage-ui-evidence
          path: verify-stages/
          retention-days: 1

      - name: Upload UI evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-evidence
          path: test-results/
          retention-days: 14

      - name: List screenshots in summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### UI evidence"
            echo "Artifact: [ui-evidence](${ARTIFACT_URL})"
            find test-results -name '*.png' | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    # Named for what the gate does, not the numbers it currently uses. The
    # floors live in scripts/check-lighthouse-score.mjs and are meant to be
    # raised as scores improve; putting them in the job name would make every
    # raise a branch-protection change, which is how the previous name
    # ("100/100/100/100") drifted into claiming a bar it no longer enforced.
    name: Lighthouse (score floors)
    runs-on: ubuntu-latest
    needs: [coverage, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run start -- -p 3000 > /tmp/learn.log 2>&1 &
          echo $! > /tmp/learn.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/pricing > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/learn.log
          exit 1

      - name: Enforce Lighthouse scores
        run: npm run lighthouse:ci

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/learn.pid ]; then
            kill "$(cat /tmp/learn.pid)" || true
          fi

  verify-report:
    # Merges every job's VERIFY stage counts into one machine-readable artifact for the merge gate
    # (job summaries aren't readable via the REST API). Fails if any expected stage is missing.
    name: Verify Report
    runs-on: ubuntu-latest
    needs: [coverage, ui-evidence]
    if: always()

    steps:
      - name: Download stage counts
        uses: actions/download-artifact@v8
        with:
          pattern: verify-stage-*
          path: verify-stages
          merge-multiple: true

      - name: Merge into verify-report.json
        env:
          EXPECTED_STAGES: unit integration ui
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for s in $EXPECTED_STAGES; do
            f="verify-stages/$s.json"
            [ -f "$f" ] || { echo "::error::missing VERIFY stage '$s'"; exit 1; }
            jq -e --arg s "$s" '.stage == $s and ([.tests, .passed, .failed, .skipped] | all(type == "number" and . == floor and . >= 0))
              and (.passed_ids | type == "array" and all(type == "string"))' "$f" > /dev/null \
              || { echo "::error::unparseable VERIFY stage '$s'"; cat "$f"; exit 1; }
          done
          jq -n --arg repo "$REPO" --arg commit "$COMMIT" '{schema: 1, repo: $repo, commit: $commit, stages: [inputs | .passed_ids |= (unique | sort)]}' \
            $(for s in $EXPECTED_STAGES; do echo "verify-stages/$s.json"; done) > verify-report.json
          cat verify-report.json

      - name: Upload verify-report
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: verify-report.json
          retention-days: 30
